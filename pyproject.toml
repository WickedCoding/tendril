[project]
name = "tendril"
version = "0.1.0"
description = "A Python TUI for managing JIRA issues and boards."
readme = "README.md"
authors = [
    { name = "Jurriën Dokter", email = "jurrien@letstalk.nl" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "keyring>=25",
    "atlassian-python-api>=3.41",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "textual>=0.71",
    "tomli-w>=1.0",
]

[project.scripts]
tendril = "tendril.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["uv_build>=0.8.23,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
