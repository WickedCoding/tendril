[project]
name = "tendril-jira"
version = "1.2.1"
description = "A keyboard-driven local JIRA companion (TUI + SQLite cache)."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Jurriën Dokter", email = "jurrien@letstalk.nl" }
]
requires-python = ">=3.12"
keywords = ["jira", "tui", "textual", "cli", "atlassian"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Terminals",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "keyring>=25",
    "atlassian-python-api>=3.41",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "textual>=0.71",
    "tomli-w>=1.0",
    "alembic>=1.13",
]

[project.scripts]
tendril = "tendril.cli:app"

[project.urls]
Homepage      = "https://github.com/WickedCoding/tendril"
Repository    = "https://github.com/WickedCoding/tendril"
Issues        = "https://github.com/WickedCoding/tendril/issues"
Documentation = "https://github.com/WickedCoding/tendril#readme"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["uv_build>=0.8.23,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tendril"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
